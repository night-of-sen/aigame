name: Auto Deploy to Hostinger VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: synthplay-vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy latest main to Hostinger VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_SSH_KEY" ] || [ -z "$VPS_HOST" ]; then
            echo "Auto-deploy standby: add VPS_HOST, VPS_USER, and VPS_SSH_KEY in GitHub Repo Settings -> Secrets -> Actions to enable."
            exit 0
          fi

          mkdir -p ~/.ssh
          if printf '%s' "$VPS_SSH_KEY" | grep -q "BEGIN"; then
            printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          else
            printf '%s' "$VPS_SSH_KEY" | tr -d ' \n\r\t' | base64 -d > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "${VPS_USER:-root}@${VPS_HOST}" '
            set -e
            cd /opt/synthplay
            git pull origin main
            docker compose up -d --build
            docker image prune -f
          '
