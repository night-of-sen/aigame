# SYNTHPLAY — Option B Production Stack (Dedicated VPS + Docker + Cloudflare R2)
# Recommended Host: Hetzner CX33 (4 vCPU / 8GB RAM, ~$9.8/mo) or Hostinger KVM 2 (2 vCPU / 8GB RAM)

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - admin

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: synthplay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_strong_password}
      POSTGRES_DB: synthplay
    volumes:
      - pg_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 1536M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synthplay"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 640M

  meilisearch:
    image: getmeili/meilisearch:v1.12
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-change_me_meili_master_key}
      MEILI_ENV: production
    volumes:
      - meili_data:/meili_data
    deploy:
      resources:
        limits:
          memory: 768M

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_MAIN_DOMAIN: ${NEXT_PUBLIC_MAIN_DOMAIN:-https://synthplay.games}
        NEXT_PUBLIC_ADMIN_DOMAIN: ${NEXT_PUBLIC_ADMIN_DOMAIN:-https://admin.synthplay.games}
        NEXT_PUBLIC_SANDBOX_DOMAIN: ${NEXT_PUBLIC_SANDBOX_DOMAIN:-https://synthplay-box.cloud}
        NEXT_PUBLIC_ADSENSE_CLIENT: ${NEXT_PUBLIC_ADSENSE_CLIENT:-}
        NEXT_PUBLIC_ADSENSE_SLOT_HALL: ${NEXT_PUBLIC_ADSENSE_SLOT_HALL:-}
        NEXT_PUBLIC_ADSENSE_SLOT_GAME: ${NEXT_PUBLIC_ADSENSE_SLOT_GAME:-}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3000
      NODE_ENV: production
      SYNTHPLAY_STORE_PATH: /app/data/synthplay-store.json
    volumes:
      - synthplay_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 1536M

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_MAIN_DOMAIN: ${NEXT_PUBLIC_MAIN_DOMAIN:-https://synthplay.games}
        NEXT_PUBLIC_ADMIN_DOMAIN: ${NEXT_PUBLIC_ADMIN_DOMAIN:-https://admin.synthplay.games}
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3001
      NODE_ENV: production
      SYNTHPLAY_STORE_PATH: /app/data/synthplay-store.json
    volumes:
      - synthplay_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1024M

volumes:
  caddy_data:
  caddy_config:
  pg_data:
  redis_data:
  meili_data:
  synthplay_data:
